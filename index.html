@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap');

/* ═══ ADVANCED DESIGN TOKENS ═════════════════════════════════════ */
:root {
  --bg:          #ede6ff;
  --paper:       #ffffff;
  --ink:         #0a021d;
  --muted:       #29154d;
  --d:           #120344;
  --p:           #3b0e91;
  --m:           #5f2cb8;
  --l:           #894ed5;
  --accent:      #b380ff;
  --pale:        #e3d4ff;
  --line:        rgba(95,44,184,.15);
  --glass:       rgba(255,255,255,.94);
  --font-ar:     'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-ar);
  color: var(--ink);
  direction: rtl;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; }

/* ═══ SLIDE CONTAINER (ROCK SOLID) ═════════════════════════════ */
.deck {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}

.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  opacity: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}

.slide.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}

/* Ambient static glow */
.slide::before {
  content: '';
  position: absolute;
  top: -18%;
  left: -12%;
  width: 55vw;
  height: 55vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(137,78,213,.15) 0%, transparent 68%);
  pointer-events: none;
  z-index: 0;
}

.slide::after {
  content: '';
  position: absolute;
  bottom: -18%;
  right: -12%;
  width: 50vw;
  height: 50vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,14,145,.1) 0%, transparent 68%);
  pointer-events: none;
  z-index: 0;
}

/* ═══ TOP HEADER (SLIDES 2..15) ════════════════════════════════ */
.slide-header {
  position: relative;
  z-index: 10;
  width: 100%;
  height: clamp(52px, 7.2vh, 68px);
  padding: 0 clamp(24px, 4vw, 60px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--glass);
  backdrop-filter: blur(14px);
  border-bottom: 1.5px solid var(--line);
}

.brand-mini {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--d);
  font-size: clamp(14px, 1.2vw, 17px);
  font-weight: 800;
}

.mark-logo {
  width: clamp(38px, 4.5vh, 46px);
  height: clamp(38px, 4.5vh, 46px);
  object-fit: cover;
  object-position: 30% 37%;
  border-radius: 10px;
  box-shadow: 0 4px 14px rgba(59,14,145,.2);
}

.header-tag {
  color: var(--m);
  font-size: clamp(12px, 1.05vw, 15px);
  font-weight: 700;
  background: rgba(137,78,213,.12);
  padding: 4px 16px;
  border-radius: 999px;
  border: 1px solid rgba(137,78,213,.24);
}

/* ═══ TITLE SLIDE (SLIDE 1) ═════════════════════════════════════ */
.title-slide {
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(135deg, #ffffff 0%, #f7f2ff 45%, #ecddff 100%);
  padding: 24px;
}

.orb {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(60px);
}
.orb-1 { width: 55vw; height: 55vw; top: -22%; right: -16%; background: radial-gradient(circle, rgba(137,78,213,.26) 0%, transparent 70%); }
.orb-2 { width: 45vw; height: 45vw; bottom: -18%; left: -12%; background: radial-gradient(circle, rgba(59,14,145,.2) 0%, transparent 70%); }

.title-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 950px;
  width: 90%;
  gap: clamp(12px, 2vh, 24px);
}

.hero-logo-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.hero-logo {
  width: min(720px, 86vw);
  max-height: clamp(240px, 44vh, 390px);
  object-fit: contain;
  filter: drop-shadow(0 20px 45px rgba(59,14,145,.3));
}

.title-heading {
  color: var(--d);
  font-size: clamp(26px, 3.5vw, 50px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: -.5px;
}

.title-line {
  width: min(300px, 48%);
  height: 5px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--d), var(--m), var(--l));
  box-shadow: 0 0 20px rgba(95,44,184,.4);
}

.title-sub {
  color: var(--muted);
  font-size: clamp(16px, 1.85vw, 24px);
  font-weight: 600;
  line-height: 1.6;
}

/* ═══ SLIDE BODY LAYOUT (ALTERNATING 2 COLUMNS) ═════════════════ */
.slide-body {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: clamp(20px, 3.5vw, 56px);
  padding: clamp(8px, 1.5vh, 16px) clamp(24px, 4.5vw, 64px) clamp(38px, 5.5vh, 60px);
  overflow: hidden;
}

.slide-body.dir-media-left {
  flex-direction: row-reverse;
}

.slide-body.dir-media-right {
  flex-direction: row;
}

/* ═══ TEXT COLUMN ═══════════════════════════════════════════════ */
.copy-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: right;
  gap: clamp(2px, .6vh, 6px);
}

.badge-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--m);
  font-size: clamp(13px, 1.15vw, 16px);
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.badge-eyebrow::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--m);
}

.heading-title {
  color: var(--d);
  font-size: clamp(26px, 3.2vw, 44px);
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 8px;
}

.heading-bar {
  width: 140px;
  height: 4.5px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--d), var(--m), var(--l));
  margin-bottom: clamp(8px, 1.3vh, 14px);
}

.main-desc {
  color: var(--muted);
  font-size: clamp(15px, 1.4vw, 20.5px);
  font-weight: 600;
  line-height: 1.75;
  margin-bottom: clamp(8px, 1.2vh, 13px);
}

.section-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--p);
  font-size: clamp(15px, 1.35vw, 20px);
  font-weight: 900;
  margin-bottom: clamp(5px, .9vh, 9px);
}
.section-tag::before {
  content: '';
  width: 16px;
  height: 3.5px;
  border-radius: 999px;
  background: var(--l);
}

/* Bullet list */
.bullets-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: clamp(5px, .9vh, 8px);
}

.bullets-list li {
  display: grid;
  grid-template-columns: 12px 1fr;
  gap: 12px;
  align-items: start;
  color: var(--ink);
  font-size: clamp(14px, 1.25vw, 18px);
  font-weight: 600;
  line-height: 1.55;
}

.bullets-list li::before {
  content: '';
  width: 9px;
  height: 9px;
  margin-top: 6px;
  border-radius: 50%;
  background: var(--m);
}

/* ═══ IMAGE COLUMN & ROTATING RING ══════════════════════════════ */
.media-col {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

.ring-container {
  position: relative;
  width: clamp(220px, 46vh, 460px);
  height: clamp(220px, 46vh, 460px);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Smooth pure CSS rotation */
@keyframes spinRing {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.spin-svg {
  position: absolute;
  inset: -14px;
  width: calc(100% + 28px);
  height: calc(100% + 28px);
  pointer-events: none;
  z-index: 5;
  overflow: visible;
  animation: spinRing 8s linear infinite;
  transform-origin: 50% 50%;
}

.circle-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  background: var(--pale);
  box-shadow:
    0 0 0 4px rgba(95,44,184,.25),
    0 20px 55px rgba(18,3,68,.28),
    0 0 45px rgba(137,78,213,.22);
}

.circle-frame figure {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  opacity: 0;
  transition: opacity .4s ease;
}

.circle-frame figure.active {
  opacity: 1;
}

.circle-frame figure img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 25%;
  display: block;
}

/* Gallery switcher */
.dots-bar {
  position: absolute;
  bottom: 14px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  z-index: 10;
}
.dot-btn {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  border: 1.5px solid var(--p);
  cursor: pointer;
  transition: all .25s ease;
}
.dot-btn.active {
  width: 26px;
  border-radius: 999px;
  background: var(--p);
  box-shadow: 0 0 10px rgba(59,14,145,.5);
}

.gallery-subhead {
  color: var(--p);
  font-size: clamp(16px, 1.4vw, 22px);
  font-weight: 900;
  margin-bottom: 6px;
}
.gallery-hint-text {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--m);
  font-size: 13px;
  font-weight: 700;
  opacity: .85;
}

/* ═══ ABOUT CARD SLIDE ══════════════════════════════════════════ */
.about-card-box {
  background: linear-gradient(135deg, #ffffff 0%, #f4edff 100%);
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 30px 36px;
  box-shadow: 0 12px 36px rgba(59,14,145,.1);
  margin-top: 10px;
  border-right: 6px solid var(--p);
}
.about-card-label {
  color: var(--p);
  font-size: clamp(16px, 1.5vw, 22px);
  font-weight: 900;
  margin-bottom: 10px;
}
.about-card-val {
  color: var(--d);
  font-size: clamp(34px, 4vw, 56px);
  font-weight: 900;
}

/* ═══ ORG CHART SLIDE (DEEP COSMOS THEME) ══════════════════════ */
.orgchart-slide {
  background: linear-gradient(145deg, #02000a 0%, #0a0328 25%, #120542 50%, #1c0860 75%, #280c72 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(10px, 1.6vh, 18px) clamp(16px, 2vw, 28px) clamp(8px, 1.2vh, 14px);
  direction: rtl;
  gap: 0;
}
.orgchart-slide::before, .orgchart-slide::after { display: none; }

.oc-glow {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(85px);
}
.oc-glow.g1 { width: 52vw; height: 52vw; background: rgba(95,44,184,.32); top: -20%; left: 0; }
.oc-glow.g2 { width: 48vw; height: 48vw; background: rgba(59,14,145,.28); bottom: -20%; right: 0; }

.oc-head {
  display: flex;
  align-items: center;
  gap: 20px;
  justify-content: center;
  padding: 0 14px 8px;
  border-bottom: 1.5px solid rgba(137,78,213,.25);
  margin-bottom: 8px;
  position: relative;
  z-index: 2;
  width: 100%;
}
.oc-head-logo-box {
  background: #ffffff;
  border: 2px solid rgba(190, 145, 255, 0.95);
  border-radius: 14px;
  padding: 4px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 22px rgba(137, 78, 213, 0.45);
}
.oc-head-logo {
  height: clamp(40px, 5.6vh, 58px);
  width: auto;
  object-fit: contain;
}
.oc-head-titles {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.oc-ht-main {
  color: #fff;
  font-size: clamp(19px, 2.2vw, 30px);
  font-weight: 900;
  text-shadow: 0 0 25px rgba(137,78,213,.65);
}
.oc-ht-sub {
  color: #d8b4fe;
  font-size: clamp(13px, 1.2vw, 17px);
  font-weight: 700;
}

.oc-spine {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 2;
}
.oc-vline {
  width: 2.5px;
  height: 8px;
  background: linear-gradient(180deg, rgba(180,140,255,.7), rgba(120,80,220,.3));
}
.oc-pill {
  border-radius: 12px;
  font-weight: 900;
  color: #fff;
  text-align: center;
  padding: 5px 24px;
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 4px 24px rgba(59,14,145,.55);
}
.oc-pill.vp {
  font-size: clamp(11.5px, 1.1vw, 16px);
  background: linear-gradient(135deg, rgba(95,44,184,.92), rgba(59,14,145,.96));
}
.oc-pill.dir {
  font-size: clamp(10.5px, 1vw, 14.5px);
  background: linear-gradient(135deg, rgba(59,14,145,.94), rgba(18,3,68,.99));
}
.ocr-grid {
  display: grid;
  gap: 12px;
  width: 100%;
  max-width: 1280px;
  margin: 8px auto 0;
  position: relative;
  z-index: 2;
}
.ocr-grid.count-6 {
  grid-template-columns: repeat(3, 1fr);
}
.ocr-grid.count-7 {
  grid-template-columns: repeat(4, 1fr);
}
@media (max-width: 1100px) {
  .ocr-grid.count-6, .ocr-grid.count-7 {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 650px) {
  .ocr-grid.count-6, .ocr-grid.count-7 {
    grid-template-columns: 1fr;
  }
}

.ocr-card {
  background: linear-gradient(155deg, rgba(95,44,184,.38) 0%, rgba(20,4,58,.88) 100%);
  border: 1.5px solid rgba(190,145,255,.5);
  border-radius: 12px;
  padding: 10px 14px;
  box-shadow: 0 4px 18px rgba(18,3,68,.4);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  backdrop-filter: blur(10px);
  transition: transform .2s ease, border-color .2s ease;
}
.ocr-card:hover {
  transform: translateY(-2px);
  border-color: rgba(220,180,255,.8);
  box-shadow: 0 6px 22px rgba(137,78,213,.4);
}

.ocr-card-title {
  color: #fff;
  font-size: clamp(14px, 1.25vw, 17px);
  font-weight: 900;
  margin: 0;
  text-align: center;
  text-shadow: 0 0 12px rgba(137,78,213,.8);
}

.ocr-team-boxes-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 6px 0 10px 0;
  width: 100%;
}
.ocr-box {
  flex: 1;
  max-width: 110px;
  text-align: center;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: clamp(12px, 1.05vw, 14px);
  font-weight: 800;
  line-height: 1.2;
  box-shadow: 0 2px 6px rgba(18,3,68,.3);
}
.ocr-box.leader {
  background: linear-gradient(135deg, rgba(234,179,8,.28), rgba(161,98,7,.38));
  border: 1.2px solid rgba(253,224,71,.75);
  color: #fef08a;
}
.ocr-box.members {
  background: linear-gradient(135deg, rgba(137,78,213,.4), rgba(95,44,184,.36));
  border: 1.2px solid rgba(220,180,255,.65);
  color: #f3e8ff;
}

.ocr-bullets {
  list-style: none;
  padding: 0;
  margin: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: right;
}
.ocr-bullets li {
  display: grid;
  grid-template-columns: 10px 1fr;
  gap: 8px;
  align-items: start;
  color: #ffffff;
  font-size: clamp(13px, 1.15vw, 15.5px);
  font-weight: 600;
  line-height: 1.55;
}
.ocr-bullets li::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fef08a;
  box-shadow: 0 0 8px rgba(254,240,138,.9);
  margin-top: 6px;
}

/* ═══ NAVIGATION CONTROLS ═══════════════════════════════════════ */
.nav-controls {
  position: fixed;
  inset-inline: 16px;
  bottom: 16px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
  pointer-events: none;
}
.nav-arrow-btn {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.94);
  border: 1.5px solid rgba(95,44,184,.3);
  color: var(--p);
  font-size: 32px;
  line-height: 1;
  box-shadow: 0 10px 30px rgba(18,3,68,.22);
  cursor: pointer;
  pointer-events: auto;
  backdrop-filter: blur(14px);
  transition: all .2s ease;
}
.nav-arrow-btn:hover {
  transform: scale(1.1);
  background: #fff;
  color: var(--d);
}

/* Progress bar & counter */
.progress-bar-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: rgba(95,44,184,.14);
  z-index: 99;
}
.progress-bar-fill {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--d), var(--m), var(--l));
  transition: width .4s ease;
}
.slide-indicator {
  position: fixed;
  bottom: 22px;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--m);
  font-size: 14px;
  font-weight: 800;
  z-index: 98;
  pointer-events: none;
  opacity: .9;
}

/* ═══ RESPONSIVE ════════════════════════════════════════════════ */
@media (max-width: 860px) {
  .slide-body, .slide-body.dir-media-left, .slide-body.dir-media-right {
    flex-direction: column !important;
    align-items: center;
    overflow-y: auto;
    gap: 14px;
    padding: 14px 16px 80px;
    -webkit-overflow-scrolling: touch;
  }
  .ring-container {
    width: clamp(140px, 36vw, 210px);
    height: clamp(140px, 36vw, 210px);
    margin-bottom: 8px;
  }
  .copy-col { width: 100%; }
  .heading-title { font-size: 22px; }
  .main-desc { font-size: 15px; }
  .bullets-list li { font-size: 14px; }
  .oc-row { grid-template-columns: repeat(3, 1fr); }
}

    </style>
  </head>
  <body>
    <main class="deck" aria-live="polite" aria-label="عرض الشرائح"></main>

    <nav class="nav-controls" aria-label="التنقل بين الشرائح">
      <button class="nav-arrow-btn" id="btn-next" type="button" data-action="next" aria-label="الشريحة التالية" title="التالي (→)">
        <span aria-hidden="true">›</span>
      </button>
      <button class="nav-arrow-btn" id="btn-prev" type="button" data-action="prev" aria-label="الشريحة السابقة" title="السابق (←)">
        <span aria-hidden="true">‹</span>
      </button>
    </nav>

    <div class="slide-indicator" aria-live="polite" aria-atomic="true">١ / ١٧</div>

    <div class="progress-bar-wrap" role="progressbar" aria-label="تقدم العرض">
      <div class="progress-bar-fill"></div>
    </div>

    <script>
const logo = "images/logo.png";

const slides = [
  {
    type: "cover",

  svg.innerHTML = `

      </linearGradient>
      <linearGradient id="gB_${uid}" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a855f7" stop-opacity="1"/>
        <stop offset="100%" stop-color="#3b0e91" stop-opacity="0.15"/>
      </linearGradient>
    </defs>
    <circle cx="50" cy="50" r="47.5" fill="none" stroke="url(#gA_${uid})" stroke-width="2.8" stroke-dasharray="96 200" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="47.5" fill="none" stroke="url(#gB_${uid})" stroke-width="1.8" stroke-dasharray="52 240" stroke-linecap="round" stroke-dashoffset="-115"/>
    <circle cx="50" cy="50" r="47.5" fill="none" stroke="rgba(216,180,254,0.7)" stroke-width="1.2" stroke-dasharray="18 280" stroke-linecap="round" stroke-dashoffset="-210"/>
  `;
  return svg;
}

/* ═══════════════════════════════════════════════════════════════
   RENDER HTML TEMPLATES
═══════════════════════════════════════════════════════════════ */
function renderHeader() {
  return `
    <header class="slide-header">
      <div class="brand-mini">
        <img class="mark-logo" src="${logo}" alt="لوجو جامعة الابتكار" />
        <span>إدارة التطوع · جامعة الابتكار</span>
      </div>
      <div class="header-tag">جامعة الابتكار</div>
    </header>
  `;
}

function renderMediaFrame(images, galleryItems = null) {
  const isGal = !!galleryItems;
  const items = isGal ? galleryItems : images.map(src => ({ src }));
  const figs = items.map((it, i) => `
    <figure class="${i === 0 ? "active" : ""}" data-idx="${i}" ${isGal ? `data-label="${it.label}" data-text="${it.text}"` : ""}>
      <img src="${it.src}" alt="صورة توضيحية" />
    </figure>
  `).join("");

  const dots = isGal ? `
    <div class="dots-bar">
      ${items.map((_, i) => `<span class="dot-btn ${i === 0 ? "active" : ""}" data-idx="${i}"></span>`).join("")}
    </div>
  ` : "";

  return `
    <div class="ring-container">
      <div class="circle-frame">
        ${figs}
        ${dots}
      </div>
    </div>
  `;
}

function buildSlideHTML(s, i) {
  const dirClass = (i % 2 === 0) ? "dir-media-left" : "dir-media-right";

  if (s.type === "title") {
    return `
      <section class="slide title-slide" data-index="${i}">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="title-content">
          <div class="hero-logo-wrap">
            <img class="hero-logo" src="${s.images[0]}" alt="شعار إدارة التطوع" />
          </div>
          <h1 class="title-heading">${s.title}</h1>
          <div class="title-line"></div>
          <p class="title-sub">${s.subtitle}</p>
        </div>
      </section>
    `;
  }

  if (s.type === "about") {
    return `
      <section class="slide" data-index="${i}">
        ${renderHeader()}
        <div class="slide-body ${dirClass}">
          <div class="copy-col">
            <span class="badge-eyebrow">نبذة تعريفية</span>
            <h2 class="heading-title">${s.title}</h2>
            <div class="heading-bar"></div>
            <div class="about-card-box">
              <p class="about-card-label">${s.label}</p>
              <p class="about-card-val">${s.date}</p>
            </div>
          </div>
          <div class="media-col">
            ${renderMediaFrame(s.images)}
          </div>
        </div>
      </section>
    `;
  }

  if (s.type === "orgchart_rich") {
    const renderCards = (arr) => arr.map(c => `
      <div class="ocr-card">
        <h3 class="ocr-card-title">${c.name}</h3>
        <div class="ocr-team-boxes-row">
          <span class="ocr-box leader">ليدر</span>
          <span class="ocr-box members">أعضاء</span>
        </div>
        <ul class="ocr-bullets">
          ${c.points.map(p => `<li><span>${p}</span></li>`).join("")}
        </ul>
      </div>
    `).join("");

    return `
      <section class="slide orgchart-slide" data-index="${i}">
        <div class="oc-glow g1"></div>
        <div class="oc-glow g2"></div>
        <div class="oc-head">
          <div class="oc-head-logo-box">
            <img src="${logo}" class="oc-head-logo" alt="شعار جامعة الابتكار" />
          </div>
          <div class="oc-head-titles">
            <div class="oc-ht-main">${s.title}</div>
            <div class="oc-ht-sub">${s.subtitle}</div>
          </div>
        </div>
        <div class="oc-spine">
          <div class="oc-vline"></div>
          <div class="oc-pill vp">نائب رئيس الجامعة لخدمة المجتمع</div>
          <div class="oc-vline"></div>
          <div class="oc-pill dir">مدير إدارة التطوع</div>
          <div class="oc-vline"></div>
          <div class="oc-pill comm">اللجان التطوعية</div>
          <div class="oc-vline"></div>
        </div>
        <div class="ocr-grid count-${s.committees.length}">
          ${renderCards(s.committees)}
        </div>
      </section>
    `;
  }

  if (s.type === "gallery") {
    return `
      <section class="slide" data-index="${i}" data-type="gallery">
        ${renderHeader()}
        <div class="slide-body ${dirClass}">
          <div class="copy-col">
            <span class="badge-eyebrow">${s.eyebrow}</span>
            <h2 class="heading-title">${s.title}</h2>
            <div class="heading-bar"></div>
            <h3 class="gallery-subhead">${s.gallery[0].label}</h3>
            <p class="main-desc gallery-dynamic-text">${s.gallery[0].text}</p>
            <span class="section-tag">أبرز مجالات الرعاية والتكافل</span>
            <ul class="bullets-list">
              ${s.bullets.map(b => `<li><span>${b}</span></li>`).join("")}
            </ul>
          </div>
          <div class="media-col">
            ${renderMediaFrame(s.images, s.gallery)}
          </div>
        </div>
        <div class="gallery-hint-text">← استخدم مفاتيح الأسهم أو اضغط على النقاط للتبديل بين الفئتين →</div>
      </section>
    `;
  }

  /* Default Committee Slide */
  return `
    <section class="slide" data-index="${i}">
      ${renderHeader()}
      <div class="slide-body ${dirClass}">
        <div class="copy-col">
          <span class="badge-eyebrow">${s.eyebrow || "اللجان التطوعية"}</span>
          <h2 class="heading-title">${s.title}</h2>
          <div class="heading-bar"></div>
          <p class="main-desc">${s.description}</p>
          <span class="section-tag">أبرز المهام والاختصاصات</span>
          <ul class="bullets-list">
            ${s.bullets.map(b => `<li><span>${b}</span></li>`).join("")}
          </ul>
        </div>
        <div class="media-col">
          ${renderMediaFrame(s.images)}
        </div>
      </div>
    </section>
  `;
}

/* ═══════════════════════════════════════════════════════════════
   INITIALIZE PRESENTATION DOM
═══════════════════════════════════════════════════════════════ */
deckEl.innerHTML = slides.map((s, i) => buildSlideHTML(s, i)).join("");

// Attach rotating rings
document.querySelectorAll(".ring-container").forEach(c => {
  c.appendChild(createRingSVG());
});

/* ═══════════════════════════════════════════════════════════════
   GALLERY SWITCHER
═══════════════════════════════════════════════════════════════ */
function switchGalleryItem(slideEl, idx) {
  const figures = slideEl.querySelectorAll(".circle-frame figure");
  const dots = slideEl.querySelectorAll(".dot-btn");
  if (!figures.length) return;

  galleryImgIdx = idx;

  figures.forEach((fig, i) => {
    fig.classList.toggle("active", i === idx);
  });
  dots.forEach((dot, i) => {
    dot.classList.toggle("active", i === idx);
  });

  const activeFig = figures[idx];
  const subheadEl = slideEl.querySelector(".gallery-subhead");
  const descEl = slideEl.querySelector(".gallery-dynamic-text");

  if (activeFig && subheadEl && descEl) {
    subheadEl.textContent = activeFig.dataset.label;
    descEl.textContent = activeFig.dataset.text;
  }
}

/* ═══════════════════════════════════════════════════════════════
   ROCK-SOLID SLIDE ENTRANCE ANIMATION (ZERO JITTER)
═══════════════════════════════════════════════════════════════ */
function playSlideEntrance(slideEl, idx) {
  // Title Slide Animation
  if (slideEl.classList.contains("title-slide")) {
    const tl = gsap.timeline({ defaults: { ease: "power2.out" } });
    tl.fromTo(slideEl.querySelector(".hero-logo"), { scale: 0.9, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.8 }, 0);
    tl.fromTo(slideEl.querySelector(".title-heading"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6 }, 0.2);
    tl.fromTo(slideEl.querySelector(".title-line"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, transformOrigin: "center" }, 0.35);
    tl.fromTo(slideEl.querySelector(".title-sub"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55 }, 0.45);
    return;
  }

  // Org Chart Slide Animation
  if (slideEl.classList.contains("orgchart-slide")) {
    const tl = gsap.timeline({ defaults: { ease: "power2.out" } });
    tl.fromTo(slideEl.querySelector(".oc-head"), { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.5 }, 0);
    tl.fromTo(slideEl.querySelectorAll(".oc-spine .oc-pill"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, stagger: 0.1, duration: 0.45 }, 0.15);
    tl.fromTo(slideEl.querySelectorAll(".oc-branch"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, stagger: 0.025, duration: 0.4 }, 0.35);
    return;
  }

  // Committee Slide Animation (Smooth Stagger)
  const isEven = (idx % 2 === 0);
  const mediaX = isEven ? -30 : 30;
  const copyX = isEven ? 20 : -20;

  const tl = gsap.timeline({ defaults: { ease: "power2.out" } });

  const mediaCol = slideEl.querySelector(".media-col");
  const eyebrow = slideEl.querySelector(".badge-eyebrow");
  const title = slideEl.querySelector(".heading-title");
  const bar = slideEl.querySelector(".heading-bar");
  const subhead = slideEl.querySelector(".gallery-subhead");
  const desc = slideEl.querySelector(".main-desc, .about-card-box");
  const sectionTag = slideEl.querySelector(".section-tag");
  const bullets = slideEl.querySelectorAll(".bullets-list li");

  if (mediaCol) {
    tl.fromTo(mediaCol, { opacity: 0, x: mediaX }, { opacity: 1, x: 0, duration: 0.6 }, 0);
  }
  if (eyebrow) {
    tl.fromTo(eyebrow, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.35 }, 0.05);
  }
  if (title) {
    tl.fromTo(title, { opacity: 0, x: copyX }, { opacity: 1, x: 0, duration: 0.45 }, 0.1);
  }
  if (bar) {
    tl.fromTo(bar, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, transformOrigin: "right center" }, 0.2);
  }
  if (subhead) {
    tl.fromTo(subhead, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 }, 0.25);
  }
  if (desc) {
    tl.fromTo(desc, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, 0.28);
  }
  if (sectionTag) {
    tl.fromTo(sectionTag, { opacity: 0, x: 8 }, { opacity: 1, x: 0, duration: 0.35 }, 0.35);
  }
  if (bullets.length) {
    tl.fromTo(bullets, { opacity: 0, x: 14 }, { opacity: 1, x: 0, stagger: 0.05, duration: 0.38 }, 0.4);
  }
}

/* ═══════════════════════════════════════════════════════════════
   SMOOTH SLIDE NAVIGATION (CROSSFADE TRANSITION)
═══════════════════════════════════════════════════════════════ */
function goToSlide(targetIdx, dir = 1) {
  const slideEls = document.querySelectorAll(".slide");
  const total = slideEls.length;
  const nextIdx = ((targetIdx % total) + total) % total;

  if (isAnimating || nextIdx === activeIdx) return;
  isAnimating = true;

  const currentSlide = slideEls[activeIdx];
  const nextSlide = slideEls[nextIdx];

  galleryImgIdx = 0;
  activeIdx = nextIdx;

  // Update Indicator & Progress
  indicatorEl.textContent = `${toArabicNum(activeIdx + 1)} / ${toArabicNum(total)}`;
  progressFillEl.style.width = `${((activeIdx + 1) / total) * 100}%`;

  // Clean tweens
  gsap.killTweensOf(currentSlide);
  gsap.killTweensOf(nextSlide);
  gsap.killTweensOf(currentSlide.querySelectorAll("*"));
  gsap.killTweensOf(nextSlide.querySelectorAll("*"));

  nextSlide.classList.add("active");

  const tl = gsap.timeline({
    onComplete: () => {
      currentSlide.classList.remove("active");
      gsap.set(currentSlide, { clearProps: "all" });
      nextSlide.classList.add("active");
      isAnimating = false;
      playSlideEntrance(nextSlide, activeIdx);
    }
  });

  // Outgoing
  tl.to(currentSlide, {
    opacity: 0,
    x: dir * -30,
    duration: 0.35,
    ease: "power2.inOut"
  }, 0);

  // Incoming
  tl.fromTo(nextSlide, {
    opacity: 0,
    x: dir * 30
  }, {
    opacity: 1,
    x: 0,
    duration: 0.35,
    ease: "power2.out"
  }, 0.04);
}

function handleNext() {
  const currentSlide = document.querySelectorAll(".slide")[activeIdx];
  if (currentSlide && currentSlide.dataset.type === "gallery") {
    const figures = currentSlide.querySelectorAll(".circle-frame figure");
    if (galleryImgIdx < figures.length - 1) {
      switchGalleryItem(currentSlide, galleryImgIdx + 1);
      return;
    }
  }
  goToSlide(activeIdx + 1, 1);
}

function handlePrev() {
  const currentSlide = document.querySelectorAll(".slide")[activeIdx];
  if (currentSlide && currentSlide.dataset.type === "gallery") {
    if (galleryImgIdx > 0) {
      switchGalleryItem(currentSlide, galleryImgIdx - 1);
      return;
    }
  }
  goToSlide(activeIdx - 1, -1);
}

/* ═══════════════════════════════════════════════════════════════
   EVENT LISTENERS
═══════════════════════════════════════════════════════════════ */
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (btn) {
    if (btn.dataset.action === "next") handleNext();
    if (btn.dataset.action === "prev") handlePrev();
    return;
  }

  const dot = e.target.closest(".dot-btn");
  if (dot) {
    const slide = dot.closest(".slide");
    const idx = parseInt(dot.dataset.idx, 10);
    switchGalleryItem(slide, idx);
  }
});

document.addEventListener("keydown", (e) => {
  if (["ArrowRight", "Space", "PageDown"].includes(e.code) || e.key === "ArrowRight") {
    e.preventDefault();
    handleNext();
  } else if (["ArrowLeft", "PageUp"].includes(e.code) || e.key === "ArrowLeft") {
    e.preventDefault();
    handlePrev();
  } else if (e.key === "Home") {
    e.preventDefault();
    goToSlide(0, -1);
  } else if (e.key === "End") {
    e.preventDefault();
    goToSlide(slides.length - 1, 1);
  }
});

// Touch swipe gestures
let touchStartX = 0;
document.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) handleNext();
    else handlePrev();
  }
}, { passive: true });

/* ═══════════════════════════════════════════════════════════════
   INITIAL SETUP & FIRST SLIDE ENTRANCE
═══════════════════════════════════════════════════════════════ */
const firstSlide = document.querySelector(".slide");
if (firstSlide) {
  firstSlide.classList.add("active");
  indicatorEl.textContent = `${toArabicNum(1)} / ${toArabicNum(slides.length)}`;
  progressFillEl.style.width = `${(1 / slides.length) * 100}%`;
  playSlideEntrance(firstSlide, 0);
}

    </script>
  </body>
</html>
